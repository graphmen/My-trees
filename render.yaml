services:
  # FastAPI backend on Render free. Kafka is off. Postgres = Supabase DATABASE_URL.
  - type: web
    name: mytrees-qfield-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Redeploy trigger: serve KPIs from GeoPackages when Postgres is still empty.
    rootDir: backend
    envVars:
      - key: QFIELD_BASE_DIR
        value: /tmp/MyTrees
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: QFIELD_URL
        value: https://app.qfield.cloud/api/v1/
      # Supabase: Dashboard → Project Settings → Database → Connection string (URI)
      # Use the "direct" host on port 5432, then set this as a secret in Render.
      - key: DATABASE_URL
        sync: false
      - key: QFIELD_USERNAME
        sync: false
      - key: QFIELD_PASSWORD
        sync: false
      - key: QFIELD_PROJECT_ID
        sync: false
      - key: QFIELD_TOKEN
        sync: false

  # Optional: keep Render static hosting as a backup. Primary UI is Firebase Hosting.
  - type: web
    name: mytrees-qfield-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_BACKEND_URL
        value: https://mytrees-qfield-backend.onrender.com
